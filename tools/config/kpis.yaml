    bilibili:
      engagement_rate:
        description: "（点赞+投币+收藏+弹幕+评论）/ 播放量"
        baseline: 4.0
        target: 6.0
        stretch: 10.0
        unit: "%"
      follower_growth_rate_monthly:
        description: "月新增粉丝数"
        baseline: 4.0
        target: 5.0
