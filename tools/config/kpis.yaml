        description: "（点赞+评论+转发）/ 曝光量"
        baseline: 2.0
        target: 3.0
        stretch: 5.0
        unit: "%"
      follower_growth_rate_monthly:
        description: "月新增粉丝数"
        baseline: 3.0
        target: 4.0
        stretch: 8.0
        unit: "%"
      posting_frequency:
        description: "每周发布微博数量（含转发）"
        baseline: 5
        target: 7
        stretch: 10
