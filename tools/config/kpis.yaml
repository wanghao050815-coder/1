        unit: "%"
      follower_growth_rate_monthly:
        description: "月增粉率"
        baseline: 8.0
        target: 15.0
        stretch: 25.0
        unit: "%"
      posting_frequency:
        description: "每周发布数"
        baseline: 3
        target: 5
        stretch: 7
        unit: "posts/week"
      completion_rate:
        description: "完播率"
        baseline: 30.0
        target: 40.0
        stretch: 55.0
