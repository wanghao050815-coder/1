# ============================================================
# KPI 体系 — 以「100万→300万粉丝」为终点反推
# 三级目标：baseline（底线）→ target（目标）→ stretch（挑战）
# ============================================================

# 增长阶段定义 — 不同阶段关注不同核心指标
growth_phases:
  phase_1:
    name: "夯实根基"
    range: "100万→150万"
    estimated_duration: "4-6个月"
    core_strategy: "找到2-3个可复制的爆款公式，主力平台稳定产出"
    priority_metrics:
      - "爆款率（viral_rate）"
      - "完播率（completion_rate）"
      - "内容投产比（content_follower_roi）"
    success_criteria: "连续4周周均净增粉 ≥ 2万"

  phase_2:
    name: "多平台放量"
    range: "150万→220万"
    estimated_duration: "4-6个月"
    core_strategy: "爆款公式跨平台复制，合拍/连线引流，矩阵号联动"
    priority_metrics:
      - "跨平台分发效率"
      - "合拍引流转化率"
      - "各平台均衡增长"
    success_criteria: "至少3个平台月增长率 ≥ 5%"

  phase_3:
    name: "IP破圈"
    range: "220万→300万"
    estimated_duration: "4-6个月"
    core_strategy: "直播+私域双引擎，品牌合作提升曝光，出圈事件营销"
    priority_metrics:
      - "直播场均涨粉"
      - "私域转化率"
      - "品牌合作带量效果"
    success_criteria: "月均净增粉 ≥ 8万"

# 增长核心指标 — 所有平台通用
growth_metrics:
  net_follower_velocity:
    description: "每周全平台净增粉丝数"
    baseline: 8000
    target: 15000
    stretch: 25000
    unit: "人/周"
    alert_below: 5000

  viral_rate:
    description: "爆款率 — 超平均播放量3倍的内容占比"
    baseline: 5.0
    target: 12.0
    stretch: 20.0
    unit: "%"
    calculation: "播放量超过近30天平均值3倍的内容数 / 总发布数"

  content_follower_roi:
    description: "单条内容平均涨粉数"
    baseline: 200
    target: 500
    stretch: 1000
    unit: "人/条"
    calculation: "周净增粉 / 周发布内容数"

  fan_retention_rate:
    description: "粉丝留存率 — 老粉不取关的比例"
    baseline: 95.0
    target: 97.0
    stretch: 99.0
    unit: "%"
    calculation: "(月初粉丝数 - 月取关数) / 月初粉丝数"

  fan_activity_rate:
    description: "活跃粉丝占比 — 30天内有过互动的粉丝比例"
    baseline: 3.0
    target: 5.0
    stretch: 8.0
    unit: "%"

# 各平台分项 KPI
