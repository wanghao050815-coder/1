        target: 5.0
        stretch: 8.0
        unit: "%"
      follower_growth_rate_monthly:
        description: "月新增粉丝数 / 月初粉丝数"
        baseline: 5.0
        target: 8.0
        stretch: 12.0
        unit: "%"
      posting_frequency:
        description: "每周发布视频数量"
        baseline: 4
        target: 5
        stretch: 7
        unit: "posts/week"
      completion_rate:
        description: "完播率，抖音核心算法指标"
        baseline: 35.0
        target: 45.0
        stretch: 60.0
        unit: "%"
      avg_watch_time_seconds:
        description: "平均观看时长"
        baseline: 20
        target: 30
        stretch: 45
        unit: "seconds"
      livestream_followers_per_session:
        description: "单场直播净增粉丝"
        baseline: 200
        target: 500
        stretch: 1500
        unit: "人/场"

    xiaohongshu:
      engagement_rate:
        description: "（点赞+收藏+评论）/ 曝光量"
        baseline: 5.0
        target: 8.0
        stretch: 12.0
        unit: "%"
      follower_growth_rate_monthly:
