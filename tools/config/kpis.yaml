  # 宗门IP社区化运营指标
  sect_ip:
    description: "宗门IP社区化运营指标 — 衡量粉丝忠诚度和社群凝聚力"
    private_community_growth_rate_monthly:
      description: "私域社群月增长率（微信群、粉丝群等）"
      baseline: 5.0
      target: 10.0
      stretch: 20.0
      unit: "%"
    ugc_count_monthly_target:
      description: "用户主动产出的宗门相关UGC内容数量"
      baseline: 20
      target: 50
      stretch: 100
      unit: "pieces/month"
    veteran_fan_rewatch_rate:
      description: "老粉丝对新内容的二次观看率（宗门忠诚度指标）"
      baseline: 20.0
      target: 30.0
      stretch: 45.0
      unit: "%"
    sect_terminology_usage_rate:
      description: "评论区中粉丝主动使用宗门话语体系的比率"
      baseline: 10.0
      target: 20.0
      stretch: 35.0
      unit: "%"
    community_nps:
      description: "社区净推荐值（-100到100）"
      baseline: 40
      target: 60
      stretch: 80
      unit: "score"

  # 内容生产效率指标
  team_efficiency:
    description: "团队内容产出效率 — 确保增长不被产能瓶颈卡住"
    idea_to_publish_days:
      description: "从创意提出到内容发布的平均天数"
      baseline: 7
      target: 4
      stretch: 2
      unit: "天"
    revision_rounds:
      description: "每条内容的平均修改轮次（越少越好）"
      baseline: 3
      target: 2
      stretch: 1
      unit: "次"
    weekly_output:
      description: "全团队每周发布的内容总条数（全平台）"
      baseline: 12
      target: 18
      stretch: 25
      unit: "条/周"
    content_utilization_rate:
      description: "内容复用率 — 单条拍摄素材产出的不同平台版本数"
      baseline: 1.5
      target: 2.5
      stretch: 4.0
      unit: "版本/条"

# 预警与复盘机制
review_schedule:
  weekly_review_day: "周五"
  monthly_review_day: "每月最后一个工作日"
  alert_levels:
    yellow:
      threshold_pct: 10
      description: "偏差10-20%，数据分析师在周报中标注，策划调整下周策略"
      notify: ["data_analyst", "content_strategist"]
    red:
      threshold_pct: 20
      description: "偏差>20%，全员通知，博主介入决策"
      notify: ["data_analyst", "content_strategist", "creator"]

# 粉丝里程碑
milestones:
  - followers: 1200000
    label: "120万"
    reward: "团队聚餐"
  - followers: 1500000
    label: "150万 — Phase 1 完成"
    reward: "团队庆祝 + 策略复盘会"
  - followers: 2000000
    label: "200万"
    reward: "粉丝福利活动 + 团队奖金"
  - followers: 2200000
    label: "220万 — Phase 2 完成"
    reward: "策略复盘会 + 下阶段规划"
  - followers: 2500000
    label: "250万"
    reward: "品牌升级 / 宗门仪式"
  - followers: 3000000
    label: "300万 — 终极目标达成"
    reward: "全员大庆 + 下一阶段启动"

# 行业基准（百万粉级别健身博主参考值）
industry_benchmarks:
  description: "同量级健身博主的行业平均值，用于外部对标"
  douyin_engagement_rate: 4.5
  xiaohongshu_save_rate: 8.0
  bilibili_coin_rate: 1.8
  monthly_growth_rate: 5.0
  viral_rate: 8.0
  unit_note: "以上为百分比(%)"
